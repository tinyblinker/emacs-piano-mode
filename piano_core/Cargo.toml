[package]
name = "piano_core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = { version = "0.18.2", features = ["pipewire"] }
evdev = "0.13.2"
nix = { version = "0.31.3", features = ["event"] }
ringbuf = "0.6.0"
rustysynth = "1.3.8"

[features]
default = ["pipewire"]
pipewire = ["cpal/pipewire"]
