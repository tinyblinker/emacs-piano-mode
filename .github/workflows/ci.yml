name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: piano-keys (build, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: piano_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: Format
        run: cargo fmt --check

      - name: Build (gnu)
        run: cargo build --locked

      - name: Build (musl static)
        run: cargo build --locked --target x86_64-unknown-linux-musl

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  elisp:
    name: piano-mode.el (Emacs ${{ matrix.emacs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["28.2", "29.4", "30.1", "31.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emacs ${{ matrix.emacs }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Byte-compile piano-mode.el
        run: emacs --batch -Q -f batch-byte-compile piano-mode.el

      - name: ERT tests
        run: >-
          emacs --batch -Q -L . -l test/piano-mode-test.el
          -f ert-run-tests-batch-and-exit

      - name: checkdoc
        if: matrix.emacs == '31.1'
        run: >-
          emacs --batch -Q
          --eval '(progn (require (quote checkdoc))
                         (checkdoc-file "piano-mode.el"))'

      - name: package-lint
        if: matrix.emacs == '31.1'
        run: |
          git clone --depth 1 https://github.com/purcell/package-lint
          emacs --batch -Q -L package-lint \
            -l package-lint/package-lint.el \
            -f package-lint-batch-and-exit piano-mode.el
